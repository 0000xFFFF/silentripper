[package]
name = "silentripper"
version = "2.1.0"
edition = "2021"
description = "Blazingly fast silence remover for video, powered by libav (no ffmpeg subprocess)"
license = "MIT"

[dependencies]
ffmpeg-next = "9.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
