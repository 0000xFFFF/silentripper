name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual run = build + artifacts only, no release

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Prebuilt shared FFmpeg for Windows (BtbN). GPL build = includes libx264/libx265.
  FFMPEG_WIN_ZIP: ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip

jobs:
  build-linux:
    name: Build Linux
    # 24.04 ships FFmpeg 6.1 dev libs (this crate needs FFmpeg >= 5.1; 22.04 only has 4.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libswscale-dev libavfilter-dev libavdevice-dev \
            pkg-config clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: ./target/release/silentripper --version

      - name: Package
        run: |
          NAME="silentripper-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$NAME"
          cp target/release/silentripper README.md LICENSE "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: silentripper-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download FFmpeg (shared, with headers and import libs)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_WIN_ZIP"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          Write-Host "FFmpeg dir: $dir"
          Get-ChildItem $dir
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          "$dir\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # Gives bindgen/clang the MSVC include paths
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: cargo build --release --locked

      - name: Smoke test
        shell: pwsh
        run: .\target\release\silentripper.exe --version

      - name: Package
        shell: pwsh
        run: |
          $name = "silentripper-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target\release\silentripper.exe, README.md, LICENSE -Destination $name
          # FFmpeg runtime DLLs only (not ffmpeg.exe / ffplay.exe / ffprobe.exe)
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: silentripper-*-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Windows:** unzip and run `silentripper.exe` (FFmpeg DLLs are included).

            **Linux:** needs the FFmpeg 6.x shared libraries installed, e.g. on Ubuntu 24.04:
            `sudo apt install libavcodec60 libavformat60 libavutil58 libswresample4 libswscale7 libavfilter9 libavdevice60`
            (or simply `sudo apt install ffmpeg`).
